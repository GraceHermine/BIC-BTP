<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="BIC-BTP">

    <title>BIC-BTP</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- NAVIGATION -->
<header class="header">
    <nav class="navbar container">

        <a class="logo">
           <img src="assets/BICBTP.png" alt="Logo BIC-BTP">
        </a> </nav>
</header>


<main>

<!-- HERO SECTION -->
<section class="hero" id="accueil">

    <div class="hero-overlay"></div>

    <div class="container hero-content">

        <!-- CONTENU GAUCHE -->
        <div class="hero-text">

            <span class="eyebrow">
                BÉTON • INGÉNIERIE • CONSTRUCTION
            </span>

            <h1>
                SITE EN
                <span>CONSTRUCTION</span>
            </h1>

            <div class="hero-buttons">

                <a href="#" class="btn btn-primary">
                    Découvrir nos services →
                </a>

                <a href="mailto:info@bic-btp.com" class="btn btn-outline">
                    Nous contacter
                </a>

            </div>

        </div>

        <!-- ANIMATION DROITE -->
        <div class="hero-animation">

            <img src="assets/planche.gif"
                 alt="Animation d'un ouvrier du bâtiment">

        </div>

    </div>

</section>
</main>


<!-- FOOTER -->
<footer class="footer">

    <div class="container footer-content">
        <p>
            BÉTON • INGÉNIERIE • CONSTRUCTION
        </p> 
    </div>

    
</footer>


<script src="js/script.js"></script>

</body>
</html>
